aid: coffee-meets-bagel
name: Coffee Meets Bagel
description: >-
  Coffee Meets Bagel (CMB) is a consumer dating application built for people
  seeking serious, committed relationships rather than casual swiping. Founded
  by three sisters, the app uses a curated daily-match model and reports over
  150 million matches, with the large majority of its daters looking for a
  long-term partner. The company operates a mobile-first product for iOS and
  Android across the US, Canada, and worldwide markets, supported by a premium
  subscription tier. It was surfaced in the API Evangelist network as a
  portfolio company of DCM Ventures. Coffee Meets Bagel publishes no public
  developer or partner API, no OpenAPI/AsyncAPI specifications, and no
  /.well-known discovery surface; this profile therefore carries company
  identity, verified public web properties, and a domain-security probe only.
